name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            platform: linux/amd64
            build_tags: webkit2_41
          - os: windows-latest
            os_name: windows
            platform: windows/amd64
            build_tags: ""
          - os: macos-latest
            os_name: macos
            platform: darwin/universal
            build_tags: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "Could not parse version from tag: $GITHUB_REF"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set product version
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "
          const fs = require('fs');
          const path = 'wails.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.info = config.info || {};
          config.info.productVersion = process.env.VERSION;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          "

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAGS=""
          if [ -n "${{ matrix.build_tags }}" ]; then
            TAGS="-tags ${{ matrix.build_tags }}"
          fi
          wails build --platform ${{ matrix.platform }} $TAGS \
            -ldflags "-X main.Version=${VERSION}"

      - name: Package Windows build
        if: matrix.os_name == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $artifact = "build/bin/windows-$env:VERSION.exe"
          Move-Item -Force "build/bin/Img2Gif.exe" $artifact
          echo "artifact=$artifact" >> $env:GITHUB_OUTPUT
        id: package

      - name: Package Linux build
        if: matrix.os_name == 'linux'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          artifact="build/bin/linux-${VERSION}"
          mv build/bin/Img2Gif "$artifact"
          chmod +x "$artifact"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
        id: package

      - name: Package macOS build
        if: matrix.os_name == 'macos'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          artifact="build/bin/macos-${VERSION}.zip"
          ditto -c -k --keepParent build/bin/Img2Gif.app "$artifact"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
        id: package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: img2gif-${{ matrix.os_name }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: img2gif-*
          path: dist
          merge-multiple: true

      - name: Extract version
        id: ver
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/*
